<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0
        }
        body{
            background-color: aquamarine;
        }
        .parent{
            background-color: blueviolet;
            position: relative;

        }
        .child{
            background-color: cadetblue;
            height: 300px;
            position: relative;
        }
        h3{
            background-color: red;
            width: 200px;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>
    <section class="parent">
        <h1>Text1</h1>
        <div class="child">
            <p>hello</p>
            <h3>Welcome to PW IOI</h3>
        </div>
        <h1>Go Back</h1>
    </section>
</body>
</html>
