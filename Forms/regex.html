<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Regular Expressions : </h1>
    <form>

        <input type="text" pattern="colou?r">
        <input type="text" pattern="Adfa?r">
        <input type="text" pattern="a*r">
        <input type="text" pattern="ab*c">
        <input type="text" pattern="ab+c">
        <input type="text" pattern="adfar\.com">
        <input type="text" pattern="cat|dog">
        <input type="text" pattern="a(cat)+">
      <input type="text" pattern="[aeiou]">
      <input type="text" pattern="[0-9]+">
      <input type="text" pattern="[A-Z]+">
      <input type="text" pattern="[A-Za-z0-9_]+">
      <input type="text" pattern="[a-z]+">
      <input type="text" pattern="\d+">
      <input type="text" pattern="\D+">
      <input type="text" pattern="\w+">
      <input type="text" pattern="\W+">
      <input type="text" pattern="Hello\s+">
      <input type="text" pattern="\S+">
      <input type="text" pattern="\w{5}">
      <input type="text" pattern=".{5,8}">
      <input type="text" pattern=".{5,}">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
