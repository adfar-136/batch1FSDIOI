<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML Forms</h1>
    
    <form >
        <input type="range" min="0" max="100" value="70" step="10">
        <label for="username" >Enter username</label>
        <input name="username" autofocus value="Adfar" id="username" minlength="3" type="text" placeholder="Username enter"> <br><br>
        <label for="email">Enter email</label>
        <input id="email" name="email" readonly type="email" placeholder="email enter" required> <br> <br>
        <label for="pass">Enter Password</label>
        <input id="pass" name="pass" type="password" placeholder="password enter"> <br> <br>
        <label for="">Enter Gender <br></label>
        <input type="radio" name="gender" value="M">Male
        <input type="radio" name="gender" value="F" checked>Female
        <input type="radio" name="gender" value="O">Other <br>
        <label for="">age:</label>
        <input type="number" step="2" min="0" max="100"> <br>
        <label for="">DOB</label>
        <input type="datetime-local">
        <input type="file" name="" id="">
        <input type="color" name="" id="">
        <input type="reset" value="reset">
        <input type="month" name="" id="">
        
        <br><br><input type="submit" value="Login">
    </form>
</body>
</html>
